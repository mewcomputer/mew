[package]
name = "mew-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "mew-desktop"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
futures = { workspace = true }
libghostty-vt = { workspace = true }
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "322cd509dcccaee1f6bc44725d270598ae8171ad", features = ["profiler"] }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "322cd509dcccaee1f6bc44725d270598ae8171ad", features = ["font-kit"] }
iroh = { workspace = true }
mdstream = { workspace = true }
mew-client-core = { workspace = true }
mew-client-iroh = { workspace = true }
mew-client-local = { workspace = true }
mew-browser-host = { workspace = true }
mew-config = { workspace = true }
mew-diff = { workspace = true }
mew-desktop-supervisor = { workspace = true }
mew-protocol = { workspace = true }
mew-tui = { workspace = true }
mew-ui-model = { workspace = true }
ratatui = { workspace = true }
ratatui-mdstream = { workspace = true }
raw-window-handle = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
unicode-segmentation = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "322cd509dcccaee1f6bc44725d270598ae8171ad", features = ["test-support"] }
mew-message = { workspace = true }
tokio-tungstenite = { workspace = true }
