[package]
name = "mew"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "mew"
path = "src/main.rs"

[dependencies]
mew-message = { workspace = true }
mew-provider = { workspace = true }
mew-provider-openai = { workspace = true }
mew-provider-anthropic = { workspace = true }
mew-provider-fake = { workspace = true }
mew-provider-responses = { workspace = true }
mew-agent = { workspace = true }
mew-tools = { workspace = true }
mew-config = { workspace = true }
mew-prompts = { workspace = true }
mew-session = { workspace = true }
mew-catalog = { workspace = true }
mew-context = { workspace = true }
mew-skills = { workspace = true }
mew-personas = { workspace = true }
mew-hooks = { workspace = true }
mew-tui = { workspace = true }
mew-mcp = { workspace = true }
mew-daemon = { workspace = true }
mew-protocol = { workspace = true }
mew-hooks-runtime = { workspace = true }
mew-ext-broker = { workspace = true }
mew-subagents = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }

tokio = { workspace = true }
ulid = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
dotenvy = { workspace = true }
anyhow = { workspace = true }
libc = "0.2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
nix = { workspace = true }
tempfile = "3"
mew-raster = { path = "../mew-raster" }
tiny-skia = "0.12"

iroh = { workspace = true, optional = true }
qrcode = { workspace = true }

[features]
default = []
iroh = ["dep:iroh", "mew-daemon/iroh"]

[dev-dependencies]
strum = { version = "0.26", features = ["derive"] }
tempfile = "3"
