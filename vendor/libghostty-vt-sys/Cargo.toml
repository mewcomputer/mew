[package]
edition = "2024"
rust-version = "1.93"
name = "libghostty-vt-sys"
version = "0.2.2"
build = "build.rs"
links = "ghostty-vt"
description = "Raw FFI bindings for libghostty-vt, the Ghostty terminal emulation library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uzaaft/libghostty-rs"

[features]
default = ["vendored"]
vendored = []
bindgen-tool = ["dep:bindgen", "dep:libc", "dep:heck"]
kitty-graphics = []

[lib]
name = "libghostty_vt_sys"
path = "src/lib.rs"
# Generated C/Doxygen examples are not Rust doctests, as in the published crate.
doctest = false

[[bin]]
name = "gen-bindings"
path = "tools/gen_bindings.rs"
required-features = ["bindgen-tool"]

[dependencies]
bindgen = { version = "0.72.1", optional = true }
libc = { version = "0.2", optional = true }
heck = { version = "0.5", optional = true }

[build-dependencies]
