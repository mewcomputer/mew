[package]
edition = "2024"
rust-version = "1.93"
name = "libghostty-vt-sys"
version = "0.1.1"
build = "build.rs"
links = "ghostty-vt"
description = "Raw FFI bindings for libghostty-vt, the Ghostty terminal emulation library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uzaaft/libghostty-rs"

[features]
default = ["vendored"]
vendored = []
bindgen-tool = ["dep:bindgen", "dep:libc"]

[lib]
name = "libghostty_vt_sys"
path = "src/lib.rs"

[[bin]]
name = "gen-bindings"
path = "tools/gen_bindings.rs"
required-features = ["bindgen-tool"]

[dependencies]
bindgen = { version = "0.72.1", optional = true }
libc = { version = "0.2", optional = true }

[build-dependencies]
