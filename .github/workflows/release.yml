name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross_linker: aarch64-linux-gnu-gcc
            cross_pkg: gcc-aarch64-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install cross-compilation toolchain
        if: matrix.cross_pkg
        run: |
          sudo apt-get install -y ${{ matrix.cross_pkg }}

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: >-
            ${{ matrix.cross_linker }}
        run: cargo build --release --target ${{ matrix.target }} -p mew

      - name: Package binary
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          TARGET="${{ matrix.target }}"
          BIN_DIR="target/${TARGET}/release"
          STAGE="mew-${VERSION}-${TARGET}"

          mkdir -p "${STAGE}/bin"
          cp "${BIN_DIR}/mew" "${STAGE}/bin/mew"

          # Include a copy of the license and readme if present
          [ -f LICENSE ] && cp LICENSE "${STAGE}/" || true
          [ -f README.md ] && cp README.md "${STAGE}/" || true

          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar czf "${STAGE}.tar.gz" "${STAGE}"
          fi

          echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mew-${{ matrix.target }}
          path: ${{ env.ASSET }}

  desktop-build:
    name: Build desktop ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-release-${{ matrix.target }}

      - name: Build desktop client, daemon, and CEF helper
        run: |
          cargo build --release -p mew -p mew-desktop
          cargo build --release \
            -p mew-cef-host --bin mew-cef-host-helper --no-default-features

      - name: Package desktop app
        env:
          MEW_VERSION: ${{ github.ref_name }}
          MEW_DESKTOP_PROFILE: release
        run: |
          # Artifacts are intentionally unsigned until Apple Developer
          # credentials are available; no notarization step is expected here.
          scripts/package-desktop-native.sh
          scripts/package-desktop-release.sh

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: mew-desktop-${{ matrix.target }}
          path: |
            target/release/dist/*.dmg
            target/release/dist/*.zip

  release:
    name: Create GitHub Release
    needs: [build, desktop-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip *.dmg > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.dmg
            artifacts/*.zip
            SHA256SUMS
