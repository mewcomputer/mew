name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libc++-dev

      - name: Install Zig for Ghostty terminal emulation
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p mew

      - name: Package binary
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          TARGET="${{ matrix.target }}"
          BIN_DIR="target/${TARGET}/release"
          STAGE="mew-${VERSION}-${TARGET}"

          mkdir -p "${STAGE}/bin"
          cp "${BIN_DIR}/mew" "${STAGE}/bin/mew"

          # Include a copy of the license and readme if present
          [ -f LICENSE ] && cp LICENSE "${STAGE}/" || true
          [ -f README.md ] && cp README.md "${STAGE}/" || true

          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar czf "${STAGE}.tar.gz" "${STAGE}"
          fi

          echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mew-${{ matrix.target }}
          path: ${{ env.ASSET }}

  desktop-build:
    name: Build desktop ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            browser_arch: arm64
            browser_sha256: d680a7a96ab86e9ab9d2b571b12919b761e93682ad1de714bbd5ac849c8d7c9c
          - os: macos-15-intel
            target: x86_64-apple-darwin
            browser_arch: x64
            browser_sha256: dad3c9f9e67791a44a768a98847510c61a7b568a0499c602632b8aee411101e7

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-release-${{ matrix.target }}

      - name: Install Zig for Ghostty terminal emulation
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install native browser build tools
        run: |
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja

      - name: Install standalone agent-browser
        env:
          BROWSER_ARCH: ${{ matrix.browser_arch }}
          BROWSER_SHA256: ${{ matrix.browser_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/mew-browser-bin"
          browser="$RUNNER_TEMP/mew-browser-bin/agent-browser"
          curl --fail --location --retry 3 \
            "https://github.com/vercel-labs/agent-browser/releases/download/v0.34.0/agent-browser-darwin-$BROWSER_ARCH" \
            --output "$browser"
          printf '%s  %s\n' "$BROWSER_SHA256" "$browser" | shasum -a 256 -c -
          chmod +x "$browser"
          "$browser" --version
          echo "$RUNNER_TEMP/mew-browser-bin" >> "$GITHUB_PATH"

      - name: Build desktop client, daemon, and CEF helper
        run: |
          cargo build --release -p mew -p mew-desktop
          cargo build --release \
            -p mew-cef-host --bin mew-cef-host-helper --no-default-features

      - name: Package desktop app
        env:
          MEW_VERSION: ${{ github.ref_name }}
          MEW_DESKTOP_PROFILE: release
        run: |
          # Artifacts are intentionally unsigned until Apple Developer
          # credentials are available; no notarization step is expected here.
          scripts/package-desktop-native.sh
          scripts/package-desktop-release.sh

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: mew-desktop-${{ matrix.target }}
          path: |
            target/release/dist/*.dmg
            target/release/dist/*.zip

  release:
    name: Create GitHub Release
    needs: [build, desktop-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip *.dmg > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.dmg
            artifacts/*.zip
            SHA256SUMS
