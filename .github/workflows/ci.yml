name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-ci:
    name: Rust CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Zig for Ghostty terminal emulation
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev pkg-config libc++-dev cmake ninja-build clang \
            libfontconfig1-dev libglib2.0-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev \
            libgtk-3-dev libnss3-dev libxss-dev libasound2-dev libgbm-dev \
            bubblewrap python3-venv apparmor-profiles
          if [ -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict ]; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web UI (mew-web-bridge embeds dist/)
        run: pnpm --filter @mew/web-client build && pnpm --filter mew-web-ui build

      - name: Install CEF SDK
        run: |
          scripts/setup-ci-cef.sh "$RUNNER_TEMP/mew-cef"
          echo "CEF_PATH=$RUNNER_TEMP/mew-cef" >> "$GITHUB_ENV"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --all -- -D warnings

      - name: Build binaries for the bridge round trip
        run: cargo build --locked -p mew -p mew-web-bridge

      - name: cargo test
        env:
          MEW_REQUIRE_SUBPROCESS_E2E: 1
        run: cargo test --locked --all

  web-ci:
    name: Web UI + Client typecheck
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Test evaluation runner
        run: python3 -B -m unittest discover -s evals/tests

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web-client (tsc)
        run: pnpm --filter @mew/web-client build

      - name: Typecheck web-ui
        run: pnpm --filter mew-web-ui exec tsc --noEmit

      - name: Build web-ui
        run: pnpm --filter mew-web-ui build

      - name: Build site and validate documentation
        run: pnpm --filter site test

      - name: Web-client tests
        run: pnpm --filter @mew/web-client test

      - name: Web UI tests
        run: pnpm --filter mew-web-ui test

      - name: Electron host tests
        run: pnpm --filter @mew/electron test:unit
