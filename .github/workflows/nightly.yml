name: Nightly

on:
  schedule:
    # 05:00 UTC daily
    - cron: "0 5 * * *"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross_linker: aarch64-linux-gnu-gcc
            cross_pkg: gcc-aarch64-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: nightly-${{ matrix.target }}

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install cross-compilation toolchain
        if: matrix.cross_pkg
        run: |
          sudo apt-get install -y ${{ matrix.cross_pkg }}

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross_linker }}
        run: cargo build --release --target ${{ matrix.target }} -p mew

      - name: Package binary
        run: |
          DATE=$(date +%Y%m%d)
          TARGET="${{ matrix.target }}"
          STAGE="mew-nightly-${DATE}-${TARGET}"
          ASSET="mew-nightly-${TARGET}.tar.gz"

          mkdir -p "${STAGE}/bin"
          cp "target/${TARGET}/release/mew" "${STAGE}/bin/mew"
          [ -f LICENSE ] && cp LICENSE "${STAGE}/" || true
          [ -f README.md ] && cp README.md "${STAGE}/" || true

          tar czf "${ASSET}" "${STAGE}"
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mew-nightly-${{ matrix.target }}
          path: ${{ env.ASSET }}

  publish:
    name: Update nightly release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Delete existing nightly assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view nightly --repo mewcomputer/mew >/dev/null 2>&1; then
            gh release view nightly --repo mewcomputer/mew --json assets \
              --jq '.assets[].name' | while read -r name; do
              echo "Deleting old asset: $name"
              gh release delete-asset nightly "$name" --repo mewcomputer/mew --yes || true
            done
          fi

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          name: Nightly Build
          body: |
            Automated nightly build from `main`.

            These binaries are built from the latest commit and are **not**
            stable releases. They may contain bugs or unfinished features.
          tag_name: nightly
          prerelease: true
          files: |
            artifacts/*.tar.gz
            SHA256SUMS
