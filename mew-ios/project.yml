name: mew
options:
  bundleIdPrefix: computer.mew
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Disable Xcode 16's "debug dylib" launch split (a stub exe that loads
    # mew.debug.dylib). It's the one non-standard thing in the pre-main launch
    # path, where the app aborts inside libxpc's initializer. Link normally.
    ENABLE_DEBUG_DYLIB: "NO"
packages:
  MewMobileCore:
    path: ./MewMobileCore
targets:
  mew:
    type: application
    platform: iOS
    sources:
      - path: mew
    dependencies:
      - package: MewMobileCore
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: Network.framework
    info:
      path: mew/Info.plist
      properties:
        CFBundleDisplayName: mew
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "mew connects to your daemons over the local network and iroh relays."
        NSCameraUsageDescription: "mew uses the camera to scan QR codes when pairing with a daemon."
        UIAppFonts:
          - MiSansLatinVF.ttf
          - Banga-VF.ttf
          - IoskeleyMono-Regular.ttf
          - IoskeleyMono-Medium.ttf
          - JunicodeVF-Roman.ttf
          - JunicodeVF-Italic.ttf
          - OFLGoudyStMTT.ttf
          - OFLGoudyStMTT-Italic.ttf
schemes:
  mew:
    build:
      targets:
        mew: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
