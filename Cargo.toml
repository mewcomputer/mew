[workspace]
members = [
    "crates/mew",
    "crates/mew-message",
    "crates/mew-provider",
    "crates/mew-provider-openai",
    "crates/mew-provider-anthropic",
    "crates/mew-provider-router",
    "crates/mew-provider-fake",
    "crates/mew-acp",
    "crates/mew-acp-iroh",
    "crates/mew-agent",
    "crates/mew-tools",
    "crates/mew-mcp",
    "crates/mew-config",
    "crates/mew-session",
    "crates/mew-catalog",
    "crates/mew-context",
    "crates/mew-skills",
    "crates/mew-personas",
    "crates/mew-subagents",
    "crates/mew-hooks",
    "crates/mew-hooks-runtime",
    "crates/mew-tui",
    "crates/ratatui-mdstream",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["mew contributors"]
license = "MIT"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# http
reqwest = { version = "0.12", features = ["rustls-tls", "stream", "json"] }

# error handling
thiserror = "1"
anyhow = "1"

# id generation
ulid = { version = "1", features = ["serde"] }

# tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# async traits
async-trait = "0.1"

# futures
futures = "0.3"

# tui
ratatui = "0.30"
crossterm = { version = "0.28", features = ["event-stream"] }

# config
toml = "0.8"
directories = "5"
dotenvy = "0.15"
config = { version = "0.15", default-features = false, features = ["toml"] }

# time
chrono = { version = "0.4", features = ["serde"] }

# sse parsing for openai adapter
eventsource-stream = "0.2"

# http retry
reqwest-retry = "0.7"
reqwest-middleware = "0.4"

# filesystem / pattern matching
globset = "0.4"
ignore = "0.4"

# diff display
similar = "2"

# ansi parsing for ratatui
ansi-to-tui = "8.0.1"

# markdown streaming
mdstream = "0.2"

# text layout
unicode-width = "0.2"
unicode-segmentation = "1"

# syntax highlighting
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

# internal crates (no version yet, path-based)
mew-message = { path = "crates/mew-message" }
mew-provider = { path = "crates/mew-provider" }
mew-hooks = { path = "crates/mew-hooks" }
mew-hooks-runtime = { path = "crates/mew-hooks-runtime" }
mew-tools = { path = "crates/mew-tools" }
mew-mcp = { path = "crates/mew-mcp" }
mew-config = { path = "crates/mew-config" }
mew-session = { path = "crates/mew-session" }
mew-catalog = { path = "crates/mew-catalog" }
mew-context = { path = "crates/mew-context" }
mew-skills = { path = "crates/mew-skills" }
mew-personas = { path = "crates/mew-personas" }
mew-subagents = { path = "crates/mew-subagents" }
mew-agent = { path = "crates/mew-agent" }
mew-tui = { path = "crates/mew-tui" }
mew-provider-openai = { path = "crates/mew-provider-openai" }
mew-provider-anthropic = { path = "crates/mew-provider-anthropic" }
mew-provider-router = { path = "crates/mew-provider-router" }
mew-provider-fake = { path = "crates/mew-provider-fake" }
mew-acp = { path = "crates/mew-acp" }
mew-acp-iroh = { path = "crates/mew-acp-iroh" }
ratatui-mdstream = { path = "crates/ratatui-mdstream" }

# iroh transport (feature-flagged, not in default builds)
iroh = "0.98"
opaque-ke = "4.0"
chacha20poly1305 = "0.10"
rand = "0.8"
