<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mew garden · Jianghu</title>
  <style>
    body { margin: 0; background: #131c1c; color: #f1e8d5; font: 14px system-ui, sans-serif; }
    main { position: relative; display: grid; place-items: center; height: 100svh; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; min-height: 0; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    [data-status] { position: absolute; z-index: 2; padding: .65rem .85rem; border-radius: .45rem; background: #22312f; }
    [data-controls] {
      position: absolute; z-index: 1; bottom: clamp(1rem, 3vw, 2rem); left: 50%; transform: translateX(-50%);
      width: max-content; max-width: calc(100% - 1.6rem); display: flex; flex-wrap: wrap; justify-content: center;
      gap: .25rem; border: 1px solid #546961; border-radius: .7rem; background: #172422; padding: .35rem;
    }
    button {
      font: inherit; color: #e7e4d9; background: transparent; border: 0; border-radius: .4rem;
      padding: .5rem .68rem; min-height: 2.45rem; cursor: pointer;
    }
    button:hover { background: #30423d; }
    button[aria-pressed="true"] { background: #abc7b2; color: #172422; }
    button:focus-visible { outline: 2px solid #ebc894; outline-offset: -2px; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main data-garden-stage data-sprite-sheet="./vendor/tactics/a1.png" data-garden-model="./assets/mew-diorama.glb">
    <p data-status role="status">Loading the garden…</p>
    <canvas hidden aria-label="Mew's walled garden. Drag to orbit and scroll to zoom."></canvas>
    <div data-controls hidden role="group" aria-label="Garden views">
      <button type="button" data-focus="garden" aria-pressed="true">Overview</button>
      <button type="button" data-focus="hall" aria-pressed="false">Hall</button>
      <button type="button" data-focus="pavilion" aria-pressed="false">Pavilion</button>
      <button type="button" data-focus="gallery" aria-pressed="false">Gallery</button>
      <button type="button" data-focus="wall" aria-pressed="false">Moon gate</button>
      <button type="button" data-focus="gate" aria-pressed="false">Entry gate</button>
      <button type="button" data-focus="tower" aria-pressed="false">Tower</button>
      <button type="button" data-turn="left" aria-label="Turn left">↶</button>
      <button type="button" data-turn="right" aria-label="Turn right">↷</button>
      <button type="button" data-night aria-pressed="true">Night</button>
    </div>
  </main>
  <script type="module" src="./generated/garden-main.js"></script>
</body>
</html>
